name: Windows desktop app

on:
  push:
    paths:
      - 'desktop/**'
      - 'downloads/CaptureMail.exe'
      - '.github/workflows/windows-app.yml'
      - 'tests/windows-desktop.ps1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build Windows app
        run: dotnet build desktop/CaptureMail.csproj -c Release
      - name: Test the downloadable EXE with a visible test window
        shell: powershell
        run: ./tests/windows-desktop.ps1
