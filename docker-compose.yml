services:
  sendfile:
    build: .
    env_file: .env
    environment:
      PORT: "8989"          # inside the container
    ports:
      - "8989:8989"         # reachable from other machines on port 8989
    volumes:
      - settings:/data      # settings saved from the web UI (no images are ever stored)
    restart: unless-stopped
    read_only: true         # the rest of the container can't be written to

volumes:
  settings:
