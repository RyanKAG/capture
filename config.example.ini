[window]
# Copy one complete title from --list-windows.
title = Untitled - Notepad

[schedule]
# interval sends immediately, then repeats every interval_minutes.
# daily sends at each daily_times entry on the computer's local clock.
mode = interval
interval_minutes = 30
daily_times = 09:00, 17:30

[email]
# Add this account to Apple Mail on Mac or classic Outlook on Windows.
transport = mail_app
sender = you@gmail.com
recipients = recipient@example.com
